<svg xmlns="http://www.w3.org/2000/svg" width="760" height="805" viewBox="0 0 760 805" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif"><defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#5B6678"/></marker></defs><rect width="760" height="805" fill="#FFFFFF"/><line x1="280.0" y1="61" x2="280.0" y2="88" stroke="#5B6678" stroke-width="1.6" marker-end="url(#arr)"/><line x1="280.0" y1="133" x2="280.0" y2="160.0" stroke="#5B6678" stroke-width="1.6" marker-end="url(#arr)"/><line x1="280.0" y1="240.0" x2="280.0" y2="285" stroke="#5B6678" stroke-width="1.6" marker-end="url(#arr)"/><text x="292" y="270" font-size="13" fill="#5B6678">是</text><line x1="440.0" y1="200.0" x2="530" y2="200.0" stroke="#5B6678" stroke-width="1.6" marker-end="url(#arr)"/><text x="440" y="194" font-size="13" fill="#5B6678">否</text><line x1="280.0" y1="330" x2="280.0" y2="365" stroke="#5B6678" stroke-width="1.6" marker-end="url(#arr)"/><line x1="490" y1="399.0" x2="530" y2="399.0" stroke="#5B6678" stroke-width="1.6" marker-end="url(#arr)"/><text x="494" y="392" font-size="13" fill="#5B6678">未通过</text><line x1="280.0" y1="433" x2="280.0" y2="465" stroke="#5B6678" stroke-width="1.6" marker-end="url(#arr)"/><text x="292" y="453" font-size="13" fill="#5B6678">通过</text><line x1="280.0" y1="533" x2="280.0" y2="565" stroke="#5B6678" stroke-width="1.6" marker-end="url(#arr)"/><line x1="280.0" y1="633" x2="280.0" y2="665" stroke="#5B6678" stroke-width="1.6" marker-end="url(#arr)"/><line x1="280.0" y1="710" x2="280.0" y2="742" stroke="#5B6678" stroke-width="1.6" marker-end="url(#arr)"/><rect x="70" y="16" width="420" height="45" rx="8" fill="#F4F6F8" stroke="#8A93A3" stroke-width="1.5"/><text x="280.0" y="43.56" text-anchor="middle" font-size="15" fill="#1F2D3D">证据层（不变）：检索、选证、逐字核验</text><rect x="70" y="88" width="420" height="45" rx="8" fill="#F4F6F8" stroke="#8A93A3" stroke-width="1.5"/><text x="280.0" y="115.56" text-anchor="middle" font-size="15" fill="#1F2D3D">证据版维度先生成（每个方面）</text><polygon points="280,160.0 440.0,200 280,240.0 120.0,200" fill="#FFF7E6" stroke="#B7791F" stroke-width="1.5"/><text x="280" y="205.0" text-anchor="middle" font-size="15" fill="#1F2D3D">咨询层开启且有已核验依据？</text><rect x="530" y="166" width="210" height="68" rx="8" fill="#F4F6F8" stroke="#8A93A3" stroke-width="1.5"/><text x="635.0" y="193.56" text-anchor="middle" font-size="15" fill="#1F2D3D">否：只保存证据版</text><text x="635.0" y="216.56" text-anchor="middle" font-size="15" fill="#1F2D3D">consulting_json 为空</text><rect x="70" y="285" width="420" height="45" rx="8" fill="#EEF4FB" stroke="#2F3F9E" stroke-width="1.5"/><text x="280.0" y="312.56" text-anchor="middle" font-size="15" fill="#1F2D3D">build_consulting：逐方面写结论 / 差距 / 建议</text><rect x="70" y="365" width="420" height="68" rx="8" fill="#FFF7E6" stroke="#B7791F" stroke-width="1.5"/><text x="280.0" y="392.56" text-anchor="middle" font-size="15" fill="#1F2D3D">程序校验：引用、事实键、数字来源</text><text x="280.0" y="415.56" text-anchor="middle" font-size="15" fill="#1F2D3D">照抄、内部编号、风险等级（程序计算）</text><rect x="530" y="365" width="210" height="68" rx="8" fill="#FFF7E6" stroke="#B7791F" stroke-width="1.5"/><text x="635.0" y="392.56" text-anchor="middle" font-size="15" fill="#1F2D3D">未通过：重试一次</text><text x="635.0" y="415.56" text-anchor="middle" font-size="15" fill="#1F2D3D">仍失败则该方面标为未生成</text><rect x="70" y="465" width="420" height="68" rx="8" fill="#EEF4FB" stroke="#2F3F9E" stroke-width="1.5"/><text x="280.0" y="492.56" text-anchor="middle" font-size="15" fill="#1F2D3D">合并同类建议</text><text x="280.0" y="515.56" text-anchor="middle" font-size="15" fill="#1F2D3D">结论页（标签与风险统计一致）</text><rect x="70" y="565" width="420" height="68" rx="8" fill="#EEF4FB" stroke="#2F3F9E" stroke-width="1.5"/><text x="280.0" y="592.56" text-anchor="middle" font-size="15" fill="#1F2D3D">assign_references：</text><text x="280.0" y="615.56" text-anchor="middle" font-size="15" fill="#1F2D3D">按阅读顺序分配参考文献编号</text><rect x="70" y="665" width="420" height="45" rx="8" fill="#EEF4FB" stroke="#2F3F9E" stroke-width="1.5"/><text x="280.0" y="692.56" text-anchor="middle" font-size="15" fill="#1F2D3D">_compile 用咨询版覆盖：正文、摘要、建议</text><rect x="70" y="742" width="420" height="45" rx="8" fill="#EFF8F2" stroke="#2F7D5B" stroke-width="1.5"/><text x="280.0" y="769.56" text-anchor="middle" font-size="15" fill="#1F2D3D">保存：证据版 + consulting_json</text></svg>